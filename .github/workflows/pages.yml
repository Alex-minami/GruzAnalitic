name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static research site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/

          node <<'NODE'
          const fs = require('fs');
          const research = fs.readFileSync('_site/logistics-research.html', 'utf8');
          const calculator = fs.readFileSync('_site/logistics-economics-calculator.html', 'utf8');

          const checks = [
            [research.includes('Исследование логистического рынка РФ'), 'research title'],
            [research.includes('Калькулятор экономики'), 'calculator link'],
            [calculator.includes('Калькулятор экономики транспортного контракта'), 'calculator title'],
            [research.includes('data:image/webp;base64'), 'research logo'],
            [calculator.includes('data:image/webp;base64'), 'calculator logo'],
            [!calculator.includes('logistics-research-v2-tek.html'), 'published research link'],
          ];

          for (const [passed, name] of checks) {
            if (!passed) throw new Error(`Validation failed: ${name}`);
            console.log(`Validated: ${name}`);
          }
          NODE

          echo "Research ready: $(wc -c < _site/logistics-research.html) bytes"
          echo "Calculator ready: $(wc -c < _site/logistics-economics-calculator.html) bytes"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
