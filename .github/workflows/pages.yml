name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static research site
        run: |
          python -m pip install --quiet markdown beautifulsoup4
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/

          # Build one canonical data stream. The original 04 chunk was corrupted;
          # 04a + canonical-04-2 + 04c + 04d reconstruct it byte-for-byte.
          rm -f _site/research/data-[0-9][0-9].js
          printf "window.RESEARCH_DATA_PARTS=window.RESEARCH_DATA_PARTS||[];window.RESEARCH_DATA_PARTS.push('" > _site/research/data-01.js
          cat \
            research/source-b64-01.txt \
            research/source-b64-02.txt \
            research/source-b64-03.txt \
            research/source-b64-04a.txt \
            research/canonical-04-2.txt \
            research/source-b64-04c.txt \
            research/source-b64-04d.txt \
            research/source-b64-05.txt \
            >> _site/research/data-01.js
          printf "');\n" >> _site/research/data-01.js

          # Render the entire research into a finished static HTML page at build time.
          python _site/scripts/build_research.py _site/logistics-research.html

          # Deployment guards: no runtime research loading and no audio.
          test -s _site/logistics-research.html
          grep -q 'Executive Summary' _site/logistics-research.html
          grep -q 'Last Mile' _site/logistics-research.html
          grep -q 'research-section' _site/logistics-research.html
          ! grep -q 'DecompressionStream' _site/logistics-research.html
          ! grep -q 'research/data-01.js' _site/logistics-research.html
          ! grep -q '<audio' _site/logistics-research.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
