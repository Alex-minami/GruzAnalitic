name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static research site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/

          # Publish the already-built presentation HTML. No Markdown rendering,
          # no runtime fetch, no gzip/base64 in the visitor's browser.
          base64 --decode research/final-site.b64 > /tmp/logistics-research.html.gz
          gzip -t /tmp/logistics-research.html.gz
          gzip -dc /tmp/logistics-research.html.gz > _site/logistics-research.html

          # Deployment guards.
          test $(wc -c < _site/logistics-research.html) -gt 300000
          grep -q 'Executive Summary' _site/logistics-research.html
          grep -q 'Last Mile' _site/logistics-research.html
          grep -q 'research-section' _site/logistics-research.html
          grep -q '@media(max-width:900px)' _site/logistics-research.html
          grep -q 'Оглавление исследования' _site/logistics-research.html
          ! grep -q '<audio' _site/logistics-research.html
          ! grep -q 'DecompressionStream' _site/logistics-research.html
          ! grep -q 'fetch(' _site/logistics-research.html

          echo "Static research ready: $(wc -c < _site/logistics-research.html) bytes"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
