name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static research site
        run: |
          python -m pip install --quiet markdown beautifulsoup4
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/

          # The stored research payload has a damaged gzip trailer (CRC/ISIZE),
          # while the DEFLATE body is expected to be intact. Recover the body,
          # calculate a fresh trailer and write one canonical data chunk for the
          # build-time renderer. Nothing is decompressed in the visitor's browser.
          python - <<'PY'
          from pathlib import Path
          import base64, binascii, re, struct, zlib

          root = Path('_site/research')
          parts = []
          for p in sorted(root.glob('data-[0-9][0-9].js')):
              m = re.search(r"push\('([^']+)'\)", p.read_text(encoding='utf-8'))
              if m:
                  parts.append(m.group(1))

          if not parts:
              raise SystemExit('Research data parts not found')

          raw = base64.b64decode(''.join(parts))
          if raw[:2] != b'\x1f\x8b':
              raise SystemExit('Research payload is not gzip')

          # Parse a standards-compliant gzip header to find the raw DEFLATE body.
          flg = raw[3]
          pos = 10
          if flg & 0x04:  # FEXTRA
              xlen = int.from_bytes(raw[pos:pos+2], 'little')
              pos += 2 + xlen
          if flg & 0x08:  # FNAME
              pos = raw.index(b'\x00', pos) + 1
          if flg & 0x10:  # FCOMMENT
              pos = raw.index(b'\x00', pos) + 1
          if flg & 0x02:  # FHCRC
              pos += 2

          body = raw[pos:-8]
          data = zlib.decompress(body, -zlib.MAX_WBITS)
          crc = binascii.crc32(data) & 0xffffffff
          isize = len(data) & 0xffffffff
          fixed = raw[:-8] + struct.pack('<II', crc, isize)

          # Verify that the repaired stream is a valid gzip archive.
          check = zlib.decompress(fixed, 16 + zlib.MAX_WBITS)
          if check != data:
              raise SystemExit('Repaired research stream verification failed')

          encoded = base64.b64encode(fixed).decode('ascii')
          for p in root.glob('data-[0-9][0-9].js'):
              p.unlink()
          (root / 'data-01.js').write_text(
              "window.RESEARCH_DATA_PARTS=window.RESEARCH_DATA_PARTS||[];"
              "window.RESEARCH_DATA_PARTS.push('" + encoded + "');\n",
              encoding='utf-8'
          )
          print(f'Recovered research payload: {len(data)} bytes, CRC={crc:08x}')
          PY

          # Render the entire research into finished static HTML at build time.
          python _site/scripts/build_research.py _site/logistics-research.html

          # Deployment guards: the published page must contain the research itself,
          # not a runtime loader, and audio must be absent.
          test -s _site/logistics-research.html
          grep -q 'Executive Summary' _site/logistics-research.html
          grep -q 'Last Mile' _site/logistics-research.html
          grep -q 'research-section' _site/logistics-research.html
          ! grep -q 'DecompressionStream' _site/logistics-research.html
          ! grep -q 'research/data-01.js' _site/logistics-research.html
          ! grep -q '<audio' _site/logistics-research.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
